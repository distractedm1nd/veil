name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  formatting:
    name: Rust formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: '1.97.1'
          components: rustfmt
          cache: false
      # Scope to Veil so formatting does not traverse sibling path dependencies.
      - run: cargo fmt --package veil -- --check
