[package]
name = "veil"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
description = "A minimal Ironwood wallet with an embedded Zakura light node"

[features]
default = ["node"]
node = ["dep:zakurad", "dep:zakura-chain", "dep:zakura-network", "dep:zakura-state"]

[dependencies]
age = { version = "0.11", default-features = false }
anyhow = "1"
bip0039 = "0.12"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
futures = "0.3"
hex = "0.4"
http = "1"
jsonrpsee = { version = "0.26", features = ["server", "http-client", "macros"] }
prost = "0.14"
rand = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
schemerz = "0.2"
schemerz-rusqlite = "0.370"
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "signal", "time", "fs"] }
tokio-util = "0.7"
toml = "0.9"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

zcash_client_backend = { package = "zakura-client-backend", path = "../wallet-libraries/librustzcash/zcash_client_backend", features = ["orchard"] }
zcash_client_sqlite = { package = "zakura-client-sqlite", path = "../wallet-libraries/librustzcash/zcash_client_sqlite", features = ["orchard"] }
# SQLite's Ironwood migration calls Pczt::into_effects, gated by io-finalizer.
pczt = { package = "zakura-pczt", path = "../wallet-libraries/librustzcash/pczt", features = ["io-finalizer"] }
zcash_keys = { package = "zakura-keys", version = "=1.0.0", features = ["orchard"] }
zcash_primitives = { package = "zakura-primitives", version = "=1.0.0" }
zcash_protocol = { version = "0.10.4", features = ["local-consensus"] }
zip32 = "0.2"
zip321 = "0.9"
orchard = { package = "zakura-orchard", version = "=1.0.0" }
sapling = { package = "zakura-sapling-crypto", version = "=1.0.0" }
jubjub = { package = "zakura-jubjub", version = "=1.0.0" }
bls12_381 = { package = "zakura-bls12-381", version = "=1.0.0" }
ztreamer-protocol = { path = "../ztreamer/crates/protocol" }

zakurad = { package = "zakura", path = "../zakura-veil/crates/zakurad", default-features = false, optional = true }
zakura-chain = { path = "../zakura-veil/crates/zakura-chain", optional = true }
zakura-network = { path = "../zakura-veil/crates/zakura-network", optional = true }
zakura-state = { path = "../zakura-veil/crates/zakura-state", optional = true }

[dev-dependencies]
bs58 = { version = "0.5", features = ["check"] }
secp256k1 = "0.29"
transparent = { package = "zcash_transparent", version = "0.10", features = ["transparent-inputs"] }
zcash_primitives = { package = "zakura-primitives", version = "=1.0.0", features = ["transparent-inputs"] }
tempfile = "3"

[profile.dev]
debug = 0

[profile.test]
opt-level = 2
debug = 0

[profile.release]
lto = "thin"
